[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computefence"
dynamic = ["version"]
description = "Don't lose another RunPod checkpoint to ephemeral disk before your job bills."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "rich>=13.0.0",
    "pandas>=1.5.0",
    "typer>=0.9.0",
    "requests>=2.28.0",
]

[project.scripts]
computefence = "computefence.cli:main"

[tool.setuptools.dynamic]
version = {attr = "computefence.__version__"}
