[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "computefence"
version = "0.1.0"
description = "Pre-flight validation for GPU training runs on rented infrastructure"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "rich>=13.0.0",
    "pandas>=1.5.0",
    "typer>=0.9.0",
    "requests>=2.28.0",
]

[project.scripts]
computefence = "computefence.cli:app"